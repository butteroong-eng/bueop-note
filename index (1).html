<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#6f4e37'><title>부업노트</title><style>
:root{--bg:#f6f0e7;--card:#fffaf3;--ink:#382d27;--muted:#8a786b;--accent:#a65f3b;--line:#e8dccc;--green:#66735a;--shadow:0 8px 24px rgba(72,48,32,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 90px}.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.04em}.title{font-size:28px;margin:5px 0 22px}.hero{background:linear-gradient(135deg,#76533d,#9b6848);color:#fff;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.hero small{opacity:.8}.money{font-size:36px;font-weight:800;margin:8px 0 3px}.month{font-size:14px;opacity:.85}.section-title{font-size:16px;margin:25px 3px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cat{border:0;text-align:left;background:var(--card);padding:18px;border-radius:20px;box-shadow:var(--shadow);color:var(--ink);cursor:pointer}.cat .ico{font-size:22px}.cat b{display:block;margin:11px 0 5px;font-size:16px}.cat span{color:var(--accent);font-weight:750}.note{color:var(--muted);font-size:12px;margin:18px 4px}.page{display:none}.page.active{display:block}.back{border:0;background:transparent;font-size:16px;padding:0;color:var(--ink);cursor:pointer}.cathead{margin:20px 0;background:var(--card);border-radius:22px;padding:20px}.cathead h2{margin:0 0 10px}.catTotal{font-size:30px;font-weight:800;color:var(--accent)}form{background:var(--card);padding:18px;border-radius:22px;box-shadow:var(--shadow)}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,select{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:13px;padding:13px;font-size:16px;color:var(--ink)}.save{width:100%;margin-top:18px;border:0;border-radius:14px;padding:14px;background:var(--accent);color:white;font-weight:700;font-size:16px}.history{margin-top:22px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 3px;border-bottom:1px solid var(--line)}.row small{color:var(--muted);display:block;margin-top:3px}.amt{font-weight:750;white-space:nowrap}.neg{color:#a3473f}.del{border:0;background:none;color:#a58d7e;padding:0;margin-left:8px}.empty{color:var(--muted);text-align:center;padding:24px 0}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:26px}
</style></head><body><main class='app'>
<section id='home' class='page active'><div class='eyebrow'>나만의 부업 가계부</div><h1 class='title'>부업노트</h1><div class='hero'><small>총 누적수익</small><div id='grand' class='money'>₩0</div><div id='month' class='month'>이번 달 ₩0</div></div><h3 class='section-title'>부업별 기록</h3><div id='cats' class='grid'></div><div class='note'>카테고리를 눌러 수입을 기록하고 누적 금액을 확인하세요.</div><div class='foot'>이 페이지의 기록은 현재 이 브라우저에 저장됩니다.</div></section>
<section id='detail' class='page'><button class='back' onclick='goHome()'>← 돌아가기</button><div class='cathead'><div id='dIcon'></div><h2 id='dName'></h2><div id='dTotal' class='catTotal'>₩0</div><small>누적 금액</small></div><form id='form'><label>날짜</label><input id='date' type='date' required><div id='stockFields' style='display:none'><label>종목명</label><input id='stockName' placeholder='예: S-OIL'><label>구분</label><select id='stockType'><option value='income'>이익</option><option value='loss'>손해</option></select></div><label>금액</label><input id='amount' type='number' inputmode='numeric' min='0' placeholder='금액을 입력하세요' required><label>메모 (선택)</label><input id='memo' placeholder='간단한 메모'><button class='save' type='submit'>기록 저장</button></form><div class='history'><h3 class='section-title'>기록 내역</h3><div id='rows'></div></div></section>
</main><script>
const C=[['stock','📈','주식'],['wedding','💌','축의대'],['birthday','🎂','돌잔치'],['judge','📋','평가위원']];let current=null;const KEY='bueopnote_v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]');const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');function sum(cat){return data.filter(x=>!cat||x.cat===cat).reduce((a,x)=>a+x.amount,0)}function renderHome(){grand.textContent=won(sum());let ym=new Date().toISOString().slice(0,7);month.textContent='이번 달 '+won(data.filter(x=>x.date.startsWith(ym)).reduce((a,x)=>a+x.amount,0));cats.innerHTML=C.map(([id,ic,n])=>`<button class='cat' onclick="openCat('${id}')"><div class='ico'>${ic}</div><b>${n}</b><span>${won(sum(id))}</span></button>`).join('')}function openCat(id){current=id;let c=C.find(x=>x[0]===id);dIcon.textContent=c[1];dName.textContent=c[2];stockFields.style.display=id==='stock'?'block':'none';home.classList.remove('active');detail.classList.add('active');date.value=new Date().toISOString().slice(0,10);renderDetail()}function goHome(){detail.classList.remove('active');home.classList.add('active');renderHome()}function renderDetail(){dTotal.textContent=won(sum(current));let arr=data.filter(x=>x.cat===current).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);rows.innerHTML=arr.length?arr.map(x=>`<div class='row'><div><b>${x.cat==='stock'?(x.stock||'주식'):(x.memo||C.find(c=>c[0]===x.cat)[2])}</b><small>${x.date}${x.memo&&x.cat==='stock'?' · '+x.memo:''}</small></div><div><span class='amt ${x.amount<0?'neg':''}'>${x.amount<0?'-':''}${won(Math.abs(x.amount))}</span><button class='del' onclick='del(${x.id})'>삭제</button></div></div>`).join(''):`<div class='empty'>아직 기록이 없어요.</div>`}function del(id){if(confirm('이 기록을 삭제할까요?')){data=data.filter(x=>x.id!==id);save();renderDetail();renderHome()}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}form.addEventListener('submit',e=>{e.preventDefault();let v=Math.abs(Number(amount.value));if(!v)return;let signed=current==='stock'&&stockType.value==='loss'?-v:v;data.push({id:Date.now(),cat:current,date:date.value,amount:signed,stock:stockName.value.trim(),memo:memo.value.trim()});save();amount.value='';memo.value='';stockName.value='';renderDetail();renderHome()});renderHome();
</script></body></html>
